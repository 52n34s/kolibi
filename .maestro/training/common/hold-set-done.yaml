# Zeit-Sätze abschliessen.
#
# Nach dem Halte-Stopp erscheint "Satz fertig": die Hold-Phase bleibt auf
# ready und wird nur bei set.id-Wechsel zurückgesetzt (nicht bei set.value).
# Anhalten/Weiter ändern die Phase ohne Übernahme; erst Stopp schreibt den Wert.
appId: com.steffen.kolibi
---
- tapOn:
    id: "training.input.done"
- runFlow:
    when:
      visible:
        id: "training.timerBar.skip"
    commands:
      - tapOn:
          id: "training.timerBar.skip"
      - waitForAnimationToEnd:
          timeout: 2000
