# TAG 4c · Accept the next level for Liegestütze, finish, open the Push plan.
appId: com.steffen.kolibi
env:
  SHOT: tag4
---
- scrollUntilVisible:
    element:
      id: "training.progression.0.accept"
    direction: UP
    timeout: 10000
    centerElement: true
- takeScreenshot: ${SHOT}/09-vorschlag-karte
- tapOn:
    id: "training.progression.0.accept"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${SHOT}/10-vorschlag-angenommen
- tapOn:
    id: "training.summary.done"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${SHOT}/11-training-nach-push
